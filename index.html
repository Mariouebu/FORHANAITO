<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2v2.io オンライン対戦</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }
        .info {
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        canvas {
            border: 4px solid #333;
            background: #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
    <!-- Socket.ioのクライアントライブラリ読込 -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="info">【操作】W,A,S,D: 移動 ｜ マウス: 照準 ｜ クリック: 射撃（連射制限あり）</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 100, y: 100, size: 18, speed: 3.5, angle: 0, hp: 100
        };

        let serverPlayers = {};
        let serverBullets = [];
        let keys = {};
        let mouse = { x: 0, y: 0 };
        
        // 連射制限用（最後に撃った時間）
        let lastShootTime = 0;
        const shootInterval = 250; // ミリ秒（0.25秒に1回）

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            const now = Date.now();
            if (now - lastShootTime > shootInterval) {
                lastShootTime = now;
                const speed = 8;
                socket.emit('shoot', {
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(player.angle) * speed,
                    vy: Math.sin(player.angle) * speed
                });
            }
        });

        // サーバーからゲーム状態を受信
        socket.on('gameState', (data) => {
            serverPlayers = data.players;
            serverBullets = data.bullets;
            if (serverPlayers[socket.id]) {
                player.hp = serverPlayers[socket.id].hp;
            }
        });

        function update() {
            // ローカル移動処理
            if (keys['w'] && player.y > 20) player.y -= player.speed;
            if (keys['s'] && player.y < canvas.height - 20) player.y += player.speed;
            if (keys['a'] && player.x > 20) player.x -= player.speed;
            if (keys['d'] && player.x < canvas.width - 20) player.x += player.speed;

            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // サーバーへ自分の位置を送信
            socket.emit('playerUpdate', { x: player.x, y: player.y, angle: player.angle });
        }

        function draw() {
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 弾の描画
            for (let b of serverBullets) {
                ctx.fillStyle = '#ffffee';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // プレイヤー全体の描画
            for (let id in serverPlayers) {
                let p = serverPlayers[id];
                
                // 本体
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                // 銃身
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + Math.cos(p.angle) * 25, p.y + Math.sin(p.angle) * 25);
                ctx.stroke();

                // HPバー
                ctx.fillStyle = '#555';
                ctx.fillRect(p.x - 20, p.y - 32, 40, 6);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(p.x - 20, p.y - 32, 40 * (p.hp / 100), 6);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
